<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Parcel</title>
    <meta name="description" content="Pack the tabs in your current Chrome window and restore them later." />
    <style>
      :root { color: #172033; background: #f7f8fb; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; }
      main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 22px 0 8px; font-size: 38px; letter-spacing: -0.03em; }
      p { color: #5e6679; font-size: 17px; line-height: 1.7; }
      a { color: #4653c0; font-weight: 650; }
      .tagline { max-width: 560px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-128.png" alt="Tab Parcel icon" />
      <h1>Tab Parcel</h1>
      <p class="tagline">Pack every tab in your current Chrome window, clear the clutter, and restore the whole session whenever you need it.</p>
      <p>All tab data stays locally in your browser. No account, cloud service, analytics, advertising, or external data transmission.</p>
      <p><a href="privacy.html">Privacy Policy / プライバシーポリシー</a></p>
    </main>
  </body>
</html>
